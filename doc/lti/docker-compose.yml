services:
  mariadb:
    image: docker.io/bitnamilegacy/mariadb:11.4
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami

  moodle:
    image: docker.io/bitnamilegacy/moodle:4.5.2
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_USERNAME=admin
      # set MOODLE_PASSWORD in a .env file next to this compose file
      # (docker compose loads it automatically); falls back to the demo default
      - MOODLE_PASSWORD=${MOODLE_PASSWORD:-demo_password123}
    volumes:
      - moodle_data:/bitnami
      - ./docker-certs:/opt/bitnami/apache/conf.default/bitnami/certs
    depends_on:
      - mariadb

volumes:
  mariadb_data:
    driver: local
  moodle_data:
    driver: local

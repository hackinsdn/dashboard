{% if current_user.is_authenticated %}
<!-- Floating support chat widget -->
<style>
  #hisdn-chat-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 1040;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background-color: #007bff; color: #fff; font-size: 22px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); cursor: pointer;
  }
  #hisdn-chat-fab:hover { background-color: #0069d9; }
  #hisdn-chat-panel {
    position: fixed; bottom: 24px; right: 24px; z-index: 1041;
    box-sizing: border-box;
    width: 340px; max-width: calc(100vw - 32px); height: 460px; max-height: calc(100vh - 48px);
    display: none; flex-direction: column;
    background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.28);
  }
  #hisdn-chat-panel.open { display: flex; }
  /* On small screens the panel spans the width with symmetric side gutters
     instead of a fixed 340px anchored to the right edge, so it never overflows. */
  @media (max-width: 575.98px) {
    #hisdn-chat-fab { bottom: 16px; right: 16px; }
    #hisdn-chat-panel {
      left: 12px; right: 12px; bottom: 12px;
      width: auto; max-width: none;
      height: 75vh; max-height: calc(100vh - 24px);
    }
  }
  .hisdn-chat-header {
    background-color: #007bff; color: #fff; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .hisdn-chat-header .title { font-weight: 600; }
  .hisdn-chat-header button {
    background: transparent; border: none; color: #fff; font-size: 16px; cursor: pointer;
  }
  .hisdn-chat-body {
    flex: 1; overflow-y: auto; padding: 12px; background: #f4f6f9;
  }
  .hisdn-chat-empty { color: #6c757d; font-size: .9em; text-align: center; margin-top: 24px; }
  .hisdn-chat-msg { margin-bottom: 10px; display: flex; }
  .hisdn-chat-bubblewrap { display: flex; flex-direction: column; max-width: 80%; }
  .hisdn-chat-msg .bubble {
    padding: 8px 12px; border-radius: 12px; max-width: 100%;
    font-size: .9em; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word;
  }
  .hisdn-chat-time { font-size: .68rem; color: #8a939b; margin-top: 2px; }
  .hisdn-chat-system { text-align: center; color: #8a939b; font-size: .75rem; margin: 8px 4px; }
  .hisdn-chat-msg--user { justify-content: flex-end; }
  .hisdn-chat-msg--user .hisdn-chat-bubblewrap { align-items: flex-end; }
  .hisdn-chat-msg--user .bubble { background-color: #007bff; color: #fff; border-bottom-right-radius: 2px; }
  .hisdn-chat-msg--support { justify-content: flex-start; }
  .hisdn-chat-msg--support .hisdn-chat-bubblewrap { align-items: flex-start; }
  .hisdn-chat-msg--support .bubble { background-color: #e9ecef; color: #1f1f1f; border-bottom-left-radius: 2px; }
  .hisdn-chat-msg--assistant .bubble { background-color: #eef4ff; color: #1f1f1f; }
  .hisdn-chat-footer { border-top: 1px solid #e3e6ea; background: #fff; }
  .hisdn-chat-inputrow { display: flex; align-items: flex-end; padding: 8px; }
  .hisdn-chat-inputrow textarea {
    flex: 1; border: 1px solid #ced4da; border-radius: 4px; padding: 6px 10px; font-size: .9em;
    resize: none; line-height: 1.35; max-height: 120px; overflow-y: auto;
    font-family: inherit;
  }
  .hisdn-chat-inputrow button {
    margin-left: 6px; border: none; background-color: #007bff; color: #fff;
    border-radius: 4px; padding: 6px 12px; cursor: pointer; align-self: stretch;
  }
  .hisdn-chat-inputrow button:disabled { opacity: .6; cursor: default; }
  .hisdn-chat-actions { padding: 0 10px 8px; display: flex; justify-content: space-between; align-items: center; }
  .hisdn-chat-actions button, .hisdn-chat-actions a {
    background: transparent; border: none; color: #6c757d; font-size: .78em; cursor: pointer;
    padding: 0; text-decoration: none;
  }
  .hisdn-chat-actions a:hover { color: #007bff; text-decoration: underline; }
  .hisdn-chat-actions button:hover { color: #dc3545; text-decoration: underline; }

  /* --- mode chooser: the first thing a new conversation shows --- */
  .hisdn-chat-chooser { padding: 4px 2px; }
  .hisdn-chat-chooser p { font-size: .85em; color: #495057; margin: 4px 2px 10px; }
  .hisdn-chat-choice {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    border: 1px solid #ced4da; background: #fff; border-radius: 6px;
    padding: 10px 12px; cursor: pointer; font-size: .85em; color: #1f1f1f;
  }
  .hisdn-chat-choice:hover { border-color: #007bff; background: #f8fbff; }
  .hisdn-chat-choice .lead { display: block; font-weight: 600; margin-bottom: 2px; }
  .hisdn-chat-choice .hint { display: block; color: #6c757d; font-size: .92em; }

  /* --- assistant extras: citations, feedback, typing, escalation --- */
  .hisdn-chat-sources { margin-top: 4px; font-size: .72rem; color: #6c757d; }
  .hisdn-chat-sources .lbl { display: block; margin-bottom: 1px; }
  .hisdn-chat-sources a, .hisdn-chat-sources span.src { display: block; color: #4a6fa5; text-decoration: none; }
  .hisdn-chat-sources a:hover { text-decoration: underline; }
  .hisdn-chat-fb { margin-top: 3px; display: flex; gap: 6px; align-items: center; }
  .hisdn-chat-fb button {
    background: transparent; border: none; cursor: pointer; color: #adb5bd;
    font-size: .8rem; padding: 0 2px;
  }
  .hisdn-chat-fb button:hover { color: #6c757d; }
  .hisdn-chat-fb button.on { color: #007bff; }
  .hisdn-chat-fb button.down.on { color: #dc3545; }
  .hisdn-chat-reasons { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .hisdn-chat-reasons button {
    border: 1px solid #ced4da; background: #fff; border-radius: 10px;
    font-size: .68rem; padding: 1px 7px; color: #495057; cursor: pointer;
  }
  .hisdn-chat-reasons button:hover { border-color: #dc3545; color: #dc3545; }
  .hisdn-chat-typing { display: flex; margin-bottom: 10px; }
  .hisdn-chat-typing .bubble {
    background-color: #eef4ff; border-radius: 12px; border-bottom-left-radius: 2px;
    padding: 8px 12px; font-size: .8em; color: #6c757d;
  }
  .hisdn-chat-typing .dot { animation: hisdnBlink 1.2s infinite; }
  .hisdn-chat-typing .dot:nth-child(2) { animation-delay: .2s; }
  .hisdn-chat-typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes hisdnBlink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  #hisdn-chat-human {
    display: none; margin: 6px 10px 4px; width: calc(100% - 20px);
    border: 1px solid #ced4da; background: #fff; color: #495057;
    border-radius: 4px; padding: 5px 8px; font-size: .78em; cursor: pointer;
  }
  #hisdn-chat-human:hover { border-color: #007bff; color: #007bff; }
  #hisdn-chat-human.urge { border-color: #007bff; background: #007bff; color: #fff; font-weight: 600; }
</style>

<button id="hisdn-chat-fab" type="button" title="{{ _('Support chat') }}" aria-label="{{ _('Open support chat') }}">
  <i class="fas fa-comments"></i>
</button>

<div id="hisdn-chat-panel" role="dialog" aria-label="{{ _('Support chat') }}">
  <div class="hisdn-chat-header">
    <span class="title"><i class="fas fa-comments mr-1"></i> <span id="hisdn-chat-title">{{ _('Support') }}</span></span>
    <button id="hisdn-chat-min" type="button" title="{{ _('Minimize') }}" aria-label="{{ _('Minimize chat') }}">
      <i class="fas fa-minus"></i>
    </button>
  </div>
  <div class="hisdn-chat-body" id="hisdn-chat-body">
    <div class="hisdn-chat-chooser" id="hisdn-chat-chooser" style="display:none;">
      <p>{{ _('How can we help?') }}</p>
      <button type="button" class="hisdn-chat-choice" data-mode="support">
        <span class="lead"><i class="fas fa-life-ring mr-1"></i> {{ _('Open a support case') }}</span>
        <span class="hint">{{ _('Our team answers you here.') }}</span>
      </button>
      <button type="button" class="hisdn-chat-choice" data-mode="assistant">
        <span class="lead"><i class="fas fa-robot mr-1"></i> {{ _('Ask a question') }}</span>
        <span class="hint">{{ _('Answered from the documentation, right away.') }}</span>
      </button>
    </div>
    <div class="hisdn-chat-empty" id="hisdn-chat-empty">{{ _('Send a message and our team will get back to you.') }}</div>
  </div>
  <div class="hisdn-chat-footer">
    <button id="hisdn-chat-human" type="button">
      <i class="fas fa-user-friends mr-1"></i> {{ _('Talk to a human') }}
    </button>
    <div class="hisdn-chat-actions">
      <a href="{{ url_for('home_blueprint.list_my_support_threads') }}" title="{{ _('See all your support cases') }}">
        <i class="fas fa-list-ul"></i> {{ _('See all cases') }}
      </a>
      <button id="hisdn-chat-finish" type="button" title="{{ _('Finish this conversation') }}">
        <i class="fas fa-times-circle"></i> {{ _('Finish conversation') }}
      </button>
      <button id="hisdn-chat-newconv" type="button" title="{{ _('Start a new conversation') }}" style="display:none;">
        <i class="fas fa-plus-circle"></i> {{ _('Start new conversation') }}
      </button>
    </div>
    <form class="hisdn-chat-inputrow" id="hisdn-chat-form" autocomplete="off">
      <textarea id="hisdn-chat-input" rows="1" placeholder="{{ _('Type your message ... (Shift+Enter for a new line)') }}" aria-label="{{ _('Message') }}" required></textarea>
      <button type="submit" id="hisdn-chat-send" title="{{ _('Send') }}"><i class="fas fa-paper-plane"></i></button>
    </form>
  </div>
</div>

<script>
(function () {
  var fab = document.getElementById('hisdn-chat-fab');
  var panel = document.getElementById('hisdn-chat-panel');
  var minBtn = document.getElementById('hisdn-chat-min');
  var body = document.getElementById('hisdn-chat-body');
  var emptyState = document.getElementById('hisdn-chat-empty');
  var chooser = document.getElementById('hisdn-chat-chooser');
  var form = document.getElementById('hisdn-chat-form');
  var input = document.getElementById('hisdn-chat-input');
  var sendBtn = document.getElementById('hisdn-chat-send');
  var finishBtn = document.getElementById('hisdn-chat-finish');
  var newConvBtn = document.getElementById('hisdn-chat-newconv');
  var humanBtn = document.getElementById('hisdn-chat-human');
  var titleEl = document.getElementById('hisdn-chat-title');

  var pollTimer = null;
  var lastMessageId = 0;
  var currentThreadId = null;
  var locked = false;
  var DEFAULT_PLACEHOLDER = input.getAttribute('placeholder');

  // Assistant state. `mode` stays null until the user picks one (or an existing
  // conversation tells us which it is).
  var mode = null;
  var assistantAvailable = false;
  var feedbackEnabled = true;
  var awaitingAnswer = false;

  var TITLES = { support: '{{ _("Support") }}', assistant: '{{ _("Assistant") }}' };
  var UNAVAILABLE_TEXT = '{{ _("The assistant is unavailable right now.") }}';
  var DOWN_REASONS = [
    { code: 'wrong', label: '{{ _("Wrong answer") }}' },
    { code: 'unrelated', label: '{{ _("Not what I asked") }}' },
    { code: 'incomplete', label: '{{ _("Incomplete") }}' },
    { code: 'unclear', label: '{{ _("Hard to understand") }}' }
  ];

  function scrollBottom() { body.scrollTop = body.scrollHeight; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function formatTime(iso) {
    if (!iso) { return ''; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return ''; }
    var now = new Date();
    var time = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? time : (pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + time);
  }

  function currentPage() {
    return window.location.pathname + (document.title ? (' — ' + document.title) : '');
  }

  // Citations come from our own corpus, but a link is a link: only same-origin
  // paths and http(s) URLs are ever turned into anchors.
  function safeHref(url) {
    if (!url) { return null; }
    if (url.charAt(0) === '/') { return url; }
    return /^https?:\/\//i.test(url) ? url : null;
  }

  function renderSources(wrap, sources) {
    if (!sources || !sources.length) { return; }
    var box = document.createElement('div');
    box.className = 'hisdn-chat-sources';
    var label = document.createElement('span');
    label.className = 'lbl';
    label.textContent = '{{ _("Sources:") }}';
    box.appendChild(label);
    sources.forEach(function (src) {
      var text = '[' + (src.index || '') + '] ' + (src.title || src.doc_id || '');
      var href = safeHref(src.url);
      var node;
      if (href) {
        node = document.createElement('a');
        node.setAttribute('href', href);
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      } else {
        node = document.createElement('span');
        node.className = 'src';
      }
      node.textContent = text;
      box.appendChild(node);
    });
    wrap.appendChild(box);
  }

  function sendFeedback(messageId, vote, reason, done) {
    fetch('/api/support/messages/' + messageId + '/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ vote: vote, reason: reason || '' })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (done) { done(data ? data.feedback : null); } })
      .catch(function () { /* a lost vote is not worth an error dialog */ });
  }

  function renderFeedback(wrap, msg) {
    // No stored message (RAG_STORE_TRANSCRIPTS=False) means there is nothing to
    // attach a vote to, so we do not offer one.
    if (!feedbackEnabled || !msg.id) { return; }
    var box = document.createElement('div');
    box.className = 'hisdn-chat-fb';
    var reasons = document.createElement('div');
    reasons.className = 'hisdn-chat-reasons';
    reasons.style.display = 'none';

    function makeBtn(vote, icon, title) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.title = title;
      btn.className = (vote === 'down' ? 'down' : '') + (msg.feedback === vote ? ' on' : '');
      btn.innerHTML = '<i class="' + icon + '"></i>';
      btn.addEventListener('click', function () {
        sendFeedback(msg.id, vote, null, function (stored) {
          box.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
          if (stored) { btn.classList.add('on'); }
          reasons.style.display = (stored === 'down') ? 'flex' : 'none';
          // A bad answer and a refusal are the same problem for the user.
          if (stored === 'down') { urgeHuman(); }
        });
      });
      return btn;
    }

    box.appendChild(makeBtn('up', 'far fa-thumbs-up', '{{ _("This was helpful") }}'));
    box.appendChild(makeBtn('down', 'far fa-thumbs-down', '{{ _("This was not helpful") }}'));
    wrap.appendChild(box);

    DOWN_REASONS.forEach(function (reason) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.textContent = reason.label;
      chip.addEventListener('click', function () {
        sendFeedback(msg.id, 'down', reason.code, function () { reasons.style.display = 'none'; });
      });
      reasons.appendChild(chip);
    });
    wrap.appendChild(reasons);
  }

  function renderMessage(msg) {
    if (msg.sender === 'system') {
      var sys = document.createElement('div');
      sys.className = 'hisdn-chat-system';
      if (msg.id) { sys.setAttribute('data-id', msg.id); }
      sys.textContent = msg.body;
      body.appendChild(sys);
      if (msg.id && msg.id > lastMessageId) { lastMessageId = msg.id; }
      return;
    }
    var isUser = msg.sender === 'user';
    var isAssistant = msg.sender === 'assistant';
    var row = document.createElement('div');
    row.className = 'hisdn-chat-msg ' + (isUser ? 'hisdn-chat-msg--user' : 'hisdn-chat-msg--support')
      + (isAssistant ? ' hisdn-chat-msg--assistant' : '');
    if (msg.id) { row.setAttribute('data-id', msg.id); }
    var wrap = document.createElement('div');
    wrap.className = 'hisdn-chat-bubblewrap';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.body;
    wrap.appendChild(bubble);
    var time = document.createElement('div');
    time.className = 'hisdn-chat-time';
    time.textContent = formatTime(msg.created_at);
    wrap.appendChild(time);
    if (isAssistant) {
      renderSources(wrap, msg.sources);
      renderFeedback(wrap, msg);
    }
    row.appendChild(wrap);
    body.appendChild(row);
    if (msg.id && msg.id > lastMessageId) { lastMessageId = msg.id; }
  }

  function clearMessages() {
    var nodes = body.querySelectorAll('[data-id]');
    nodes.forEach(function (n) { n.remove(); });
    lastMessageId = 0;
  }

  function showEmpty(show) { emptyState.style.display = show ? 'block' : 'none'; }

  function showTyping(show) {
    var existing = document.getElementById('hisdn-chat-typing');
    if (existing) { existing.remove(); }
    if (!show) { return; }
    var node = document.createElement('div');
    node.className = 'hisdn-chat-typing';
    node.id = 'hisdn-chat-typing';
    node.innerHTML = '<div class="bubble">{{ _("Looking it up") }} '
      + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>';
    body.appendChild(node);
    scrollBottom();
  }

  function urgeHuman() {
    humanBtn.style.display = 'block';
    humanBtn.classList.add('urge');
  }

  function applyMode(next) {
    mode = next;
    titleEl.textContent = TITLES[next] || TITLES.support;
    form.style.display = '';
    chooser.style.display = 'none';
    humanBtn.style.display = (next === 'assistant') ? 'block' : 'none';
    humanBtn.classList.remove('urge');
  }

  function offerChoice() {
    mode = null;
    chooser.style.display = 'block';
    // Choosing is the first step; the input appears once a mode is picked.
    form.style.display = 'none';
    humanBtn.style.display = 'none';
    showEmpty(false);
  }

  function lockWidget() {
    locked = true;
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = '{{ _("This conversation has been finished.") }}';
    finishBtn.style.display = 'none';
    humanBtn.style.display = 'none';
    newConvBtn.style.display = '';
  }
  function unlockWidget() {
    locked = false;
    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = DEFAULT_PLACEHOLDER;
    finishBtn.style.display = '';
    newConvBtn.style.display = 'none';
  }
  function startNewConversation() {
    currentThreadId = null;
    awaitingAnswer = false;
    showTyping(false);
    clearMessages();
    unlockWidget();
    if (assistantAvailable) {
      offerChoice();
    } else {
      applyMode('support');
      showEmpty(true);
      input.focus();
    }
  }

  // Render any messages from a thread object that are not already shown.
  function renderThread(thread) {
    if (!thread) { return; }
    if (thread.mode && thread.mode !== mode) { applyMode(thread.mode); }
    var existing = {};
    body.querySelectorAll('[data-id]').forEach(function (n) {
      existing[n.getAttribute('data-id')] = true;
    });
    var added = false;
    (thread.messages || []).forEach(function (msg) {
      if (!existing[String(msg.id)]) { renderMessage(msg); added = true; }
    });
    if (thread.messages && thread.messages.length) { showEmpty(false); }
    if (added) { scrollBottom(); }
    if (thread.status === 'finished' && !locked) { lockWidget(); }
  }

  function syncThread() {
    if (currentThreadId == null) {
      // No conversation yet: pick up an active (open) one if it exists.
      fetch('/api/support/thread', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : { thread: null }; })
        .then(function (data) {
          if (data.thread) {
            currentThreadId = data.thread.id;
            renderThread(data.thread);
          } else if (!body.querySelector('[data-id]')) {
            if (mode === null) {
              if (assistantAvailable) { offerChoice(); } else { applyMode('support'); }
            }
            showEmpty(mode !== null);
          }
        })
        .catch(function () { /* ignore transient errors */ });
      return;
    }
    // Follow the current conversation by id so we can detect it being finished.
    fetch('/api/support/threads/' + currentThreadId, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (data && data.thread) { renderThread(data.thread); } })
      .catch(function () { /* ignore transient errors */ });
  }

  // Poll fast while an answer is pending, slowly the rest of the time.
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(syncThread, awaitingAnswer ? 3000 : 30000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function setAwaiting(value) {
    if (awaitingAnswer === value) { return; }
    awaitingAnswer = value;
    if (pollTimer) { startPolling(); }
  }

  function loadAssistantStatus() {
    return fetch('/api/support/assistant/status', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) { return; }
        assistantAvailable = !!(data.enabled && data.available);
        feedbackEnabled = data.feedback !== false;
      })
      .catch(function () { assistantAvailable = false; });
  }

  // Persist the open/minimized state so the widget survives page navigation.
  function saveOpen(v) { try { localStorage.setItem('hisdnChatOpen', v ? '1' : '0'); } catch (e) {} }
  function isSavedOpen() { try { return localStorage.getItem('hisdnChatOpen') === '1'; } catch (e) { return false; } }

  // Size and place the FAB + panel against the VISUAL viewport (not the layout
  // viewport). On pages with horizontal overflow the layout viewport can be far
  // wider than the screen, which would otherwise make the panel bigger than the
  // phone and push it off to the right.
  function placeWidget() {
    var vv = window.visualViewport;
    if (!vv) { return; }
    var m = 12, fabSize = 56;
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
    fab.style.left = Math.round(vv.offsetLeft + vv.width - fabSize - m) + 'px';
    fab.style.top = Math.round(vv.offsetTop + vv.height - fabSize - m) + 'px';
    var w = Math.min(360, vv.width - m * 2);
    var h = Math.min(460, vv.height - m * 2);
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    panel.style.maxWidth = 'none'; panel.style.maxHeight = 'none';
    panel.style.width = Math.round(w) + 'px';
    panel.style.height = Math.round(h) + 'px';
    panel.style.left = Math.round(vv.offsetLeft + vv.width - w - m) + 'px';
    panel.style.top = Math.round(vv.offsetTop + vv.height - h - m) + 'px';
  }

  function openPanel() {
    panel.classList.add('open');
    fab.style.display = 'none';
    placeWidget();
    saveOpen(true);
    // The chooser depends on whether the assistant is up, so ask first.
    loadAssistantStatus().then(function () {
      syncThread();
      startPolling();
      if (!locked && mode !== null) { input.focus(); }
    });
  }
  function minimizePanel() {
    panel.classList.remove('open');
    fab.style.display = '';
    saveOpen(false);
    stopPolling();
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', placeWidget);
    window.visualViewport.addEventListener('scroll', placeWidget);
    window.addEventListener('resize', placeWidget);
  }
  placeWidget();

  fab.addEventListener('click', openPanel);
  minBtn.addEventListener('click', minimizePanel);

  chooser.querySelectorAll('.hisdn-chat-choice').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var picked = btn.getAttribute('data-mode');
      applyMode(picked);
      showEmpty(!body.querySelector('[data-id]'));
      input.focus();
      // An existing conversation is switched server-side; one that does not
      // exist yet carries the mode on its first message, so picking a mode
      // never creates an empty support case.
      if (currentThreadId != null) {
        fetch('/api/support/thread/mode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ mode: picked })
        }).catch(function () { /* the first message carries the mode anyway */ });
      }
    });
  });

  // Auto-grow the textarea up to its CSS max-height.
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  function resetInput() {
    input.value = '';
    input.style.height = 'auto';
  }
  input.addEventListener('input', autoGrow);

  // Enter sends the message; Shift+Enter inserts a new line.
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      if (typeof form.requestSubmit === 'function') {
        form.requestSubmit();
      } else {
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    }
  });

  // Ask the assistant to answer the message we just stored. A separate request
  // on purpose: generation takes seconds on a CPU-only host, and the user's
  // message must survive a failure here.
  function requestAnswer() {
    setAwaiting(true);
    showTyping(true);
    sendBtn.disabled = true;
    fetch('/api/support/assistant/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ thread_id: currentThreadId })
    }).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; });
    }).then(function (res) {
      showTyping(false);
      if (res.status === 201) {
        (res.data.messages || []).forEach(renderMessage);
        // A refusal or an outage is the moment to offer a person.
        if (res.data.status && res.data.status !== 'answered') { urgeHuman(); }
      } else if (res.status === 409 && res.data && res.data.finished) {
        syncThread();
        lockWidget();
      } else {
        // Rate limited, disabled, or the request failed: say so, offer a human.
        renderMessage({ sender: 'system', body: (res.data && res.data.error) || UNAVAILABLE_TEXT });
        urgeHuman();
      }
      scrollBottom();
    }).catch(function () {
      showTyping(false);
      renderMessage({ sender: 'system', body: UNAVAILABLE_TEXT });
      urgeHuman();
    }).finally(function () {
      setAwaiting(false);
      if (!locked) { sendBtn.disabled = false; input.focus(); }
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (locked || mode === null) { return; }
    var text = input.value.trim();
    if (!text) { return; }
    sendBtn.disabled = true;
    showEmpty(false);
    humanBtn.classList.remove('urge');
    fetch('/api/support/thread/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ body: text, page: currentPage(), thread_id: currentThreadId, mode: mode })
    }).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; });
    }).then(function (res) {
      if (res.status === 201) {
        currentThreadId = res.data.thread_id;
        (res.data.messages || []).forEach(renderMessage);
        scrollBottom();
        resetInput();
        if (mode === 'assistant') { requestAnswer(); }
      } else if (res.status === 409 && res.data && res.data.finished) {
        // The conversation was finished (e.g. by an admin) — lock the widget
        // and pull the closing message so the user sees why.
        resetInput();
        syncThread();
        lockWidget();
      } else {
        input.value = text; // keep the text so it is not lost
      }
    }).catch(function () {
      input.value = text;
    }).finally(function () {
      if (!locked && !awaitingAnswer) { sendBtn.disabled = false; input.focus(); }
    });
  });

  humanBtn.addEventListener('click', function () {
    fetch('/api/support/thread/escalate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ thread_id: currentThreadId, page: currentPage() })
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) { return; }
        applyMode('support');
        (data.messages || []).forEach(renderMessage);
        scrollBottom();
      })
      .catch(function () { /* ignore */ });
  });

  finishBtn.addEventListener('click', function () {
    fetch('/api/support/thread/finish', { method: 'POST', credentials: 'same-origin' })
      .then(function () { startNewConversation(); })
      .catch(function () { /* ignore */ });
  });

  newConvBtn.addEventListener('click', startNewConversation);

  // Restore the widget if it was left open on a previous page.
  if (isSavedOpen()) { openPanel(); }
})();
</script>
{% endif %}
